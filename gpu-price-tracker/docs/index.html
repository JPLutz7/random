  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px 64px;
    background: var(--page);
    color: var(--text-primary);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }

  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.01em; }
  h2 { font-size: 17px; margin: 40px 0 12px; }
  .sub { color: var(--text-secondary); margin: 0 0 20px; font-size: 14px; }

  .stamps {
    display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px;
    list-style: none; padding: 0;
  }
  .stamps li {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 12px; font-size: 13px;
  }
  .stamps b { font-weight: 600; }
  .stamps span { color: var(--text-muted); }

  .filters {
    display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
    margin-bottom: 16px;
  }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--text-secondary); }
  select, input[type=search] {
    font: inherit; font-size: 14px; padding: 6px 10px;
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px; min-width: 150px;
  }
  .count { margin-left: auto; font-size: 13px; color: var(--text-muted); }

  .tablewrap {
    overflow-x: auto; background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 10px;
  }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 9px 12px; text-align: left; white-space: nowrap; }
  thead th {
    position: sticky; top: 0; background: var(--surface-1);
    border-bottom: 1px solid var(--baseline);
    font-size: 12px; font-weight: 600; color: var(--text-secondary);
    cursor: pointer; user-select: none;
  }
  thead th:hover { color: var(--text-primary); }
  thead th .arrow { color: var(--text-muted); font-size: 10px; }
  tbody tr { border-top: 1px solid var(--gridline); }
  tbody tr:hover { background: color-mix(in srgb, var(--text-primary) 4%, transparent); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .price { font-weight: 600; }
  .blank { color: var(--text-muted); font-style: italic; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .muted { color: var(--text-muted); }
  .sku { color: var(--text-secondary); font-size: 13px; white-space: normal; min-width: 260px; }
  .flag {
    font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .03em; color: var(--text-muted);
    border-bottom: 1px dotted var(--baseline); cursor: help; margin-left: 4px;
  }

  .note {
    background: var(--surface-1); border: 1px solid var(--border);
    border-left: 3px solid var(--baseline);
    border-radius: 8px; padding: 12px 16px; font-size: 13.5px;
    color: var(--text-secondary); margin: 12px 0;
  }
  .note ul { margin: 8px 0 0; padding-left: 20px; }

  .charts { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .chart {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 14px 8px;
  }
  .chart h3 { margin: 0 0 2px; font-size: 15px; }
  .chart .legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 4px; font-size: 12px; color: var(--text-secondary); }
  .chart .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .axis { fill: var(--text-muted); font-size: 10px; }
  .chart .grid { stroke: var(--gridline); stroke-width: 1; }
  .chart .base { stroke: var(--baseline); stroke-width: 1; }
  .tip {
    position: fixed; pointer-events: none; z-index: 10; opacity: 0;
    transition: opacity .1s; background: var(--surface-1);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12.5px; line-height: 1.45;
    box-shadow: 0 4px 16px rgba(0,0,0,.18); max-width: 260px;
  }
  .tip b { font-variant-numeric: tabular-nums; }
</style>

</div>

const fmtPrice = v => v === null || v === undefined ? null : "$" + v.toFixed(v < 1 ? 4 : 2);
const shortDate = ts => (ts || "").slice(0, 10);

      ? " · change shown against " + shortDate(DATA.previous)
      : " · first snapshot, no history to compare against yet");

// Each provider carries two dates: when we pulled it, and the freshness stamp
// the provider vouches for itself. They are not the same thing.
const stamps = document.getElementById("stamps");
stamps.innerHTML = Object.keys(DATA.provider_latest).sort().map(p => {

  return '<li><b>' + (DATA.provider_labels[p] || p) + '</b><br>'
       + '<span>pulled ' + pulled + ' UTC</span><br>'

            ? said.slice(0, 19).replace("T", " ") + " UTC"
            : "no stamp published") + '</span></li>';
}).join("");

/* ---------- filters ---------- */
const uniq = (key) => [...new Set(DATA.rows.map(r => r[key]).filter(Boolean))].sort();
function fill(id, values, labelOf) {
  const sel = document.getElementById(id);
  values.forEach(v => {
    const o = document.createElement("option");
    o.value = v; o.textContent = labelOf ? labelOf(v) : v;
    sel.appendChild(o);
  });
}
fill("f-chip", uniq("chip"));
fill("f-type", DATA.price_types, v => DATA.price_type_labels[v] || v);
fill("f-provider", uniq("provider"), v => DATA.provider_labels[v] || v);
fill("f-region", uniq("region"));

/* ---------- table ---------- */
const COLUMNS = [
  { key: "chip",             label: "Chip" },
  { key: "provider_label",   label: "Provider" },
  { key: "price_type_label", label: "Price type" },
  { key: "usd_per_gpu_hour", label: "$ / GPU-hour", num: true },
  { key: "change",           label: "Change", num: true },
  { key: "list_price",       label: "List price", num: true },
  { key: "gpu_count",        label: "GPUs", num: true },
  { key: "region",           label: "Region" },
  { key: "sku_name",         label: "Provider SKU" },
];

// Default view: most expensive first, so the headline chips lead.
let sortKey = "usd_per_gpu_hour", sortDir = -1;

const head = document.getElementById("head");
COLUMNS.forEach(col => {
  const th = document.createElement("th");
  th.dataset.key = col.key;
  if (col.num) th.className = "num";
  th.innerHTML = col.label + ' <span class="arrow"></span>';
  th.addEventListener("click", () => {
    if (sortKey === col.key) sortDir = -sortDir;
    else { sortKey = col.key; sortDir = col.num ? -1 : 1; }
    render();
  });
  head.appendChild(th);
});

function currentRows() {
  const chip = document.getElementById("f-chip").value;
  const type = document.getElementById("f-type").value;
  const prov = document.getElementById("f-provider").value;
  const region = document.getElementById("f-region").value;
  const q = document.getElementById("f-search").value.trim().toLowerCase();
  return DATA.rows.filter(r =>
    (!chip || r.chip === chip) &&
    (!type || r.price_type === type) &&
    (!prov || r.provider === prov) &&
    (!region || r.region === region) &&
    (!q || (r.sku_name + " " + r.sku_id + " " + r.chip).toLowerCase().includes(q))
  );
}

function compare(a, b) {
  let x = a[sortKey], y = b[sortKey];
  // Blanks always sink to the bottom, whichever way the column is sorted.
  const xb = x === null || x === undefined || x === "";
  const yb = y === null || y === undefined || y === "";
  if (xb && yb) return 0;
  if (xb) return 1;
  if (yb) return -1;
  if (typeof x === "number" && typeof y === "number") return (x - y) * sortDir;
  return String(x).localeCompare(String(y)) * sortDir;
}

function changeCell(r) {
  if (r.change === null || r.change === undefined)
    return '<td class="num blank">—</td>';
  if (r.change === 0) return '<td class="num muted">no change</td>';
  const cls = r.change > 0 ? "up" : "down";
  const sign = r.change > 0 ? "+" : "−";
  return '<td class="num ' + cls + '">' + sign + "$" + Math.abs(r.change).toFixed(2)
       + " (" + sign + Math.abs(r.change_pct).toFixed(1) + "%)</td>";
}

function render() {
  const rows = currentRows().sort(compare);
  document.getElementById("count").textContent =
    rows.length + " of " + DATA.rows.length + " rows";

  head.querySelectorAll("th").forEach(th => {
    th.querySelector(".arrow").textContent =
      th.dataset.key === sortKey ? (sortDir === 1 ? "▲" : "▼") : "";
  });

  document.getElementById("body").innerHTML = rows.map(r => {
    const per = fmtPrice(r.usd_per_gpu_hour);
    // An extrapolated figure is marked where it is read, not only in a footnote.
    const flag = r.notes && per
      ? ' <abbr class="flag" title="' + r.notes + '">extrapolated</abbr>' : "";
    return "<tr>"
      + "<td>" + (r.chip || '<span class="blank">not identified</span>') + "</td>"
      + "<td>" + r.provider_label + "</td>"
      + "<td>" + r.price_type_label + "</td>"
      + '<td class="num price">' + (per || '<span class="blank">—</span>') + flag + "</td>"
      + changeCell(r)
      + '<td class="num">' + (r.list_price === null ? "—" : "$" + r.list_price) + "</td>"
      + '<td class="num muted">' + (r.gpu_count || '<span class="blank">?</span>') + "</td>"
      + '<td class="muted">' + r.region + "</td>"
      + '<td class="sku">' + r.sku_name + ' <span class="muted">' + r.sku_id + "</span></td>"
      + "</tr>";
  }).join("");
}

["f-chip", "f-type", "f-provider", "f-search"].forEach(id =>
  document.getElementById(id).addEventListener("input", render));
render();

/* ---------- SKUs we deliberately left blank ---------- */
if (DATA.unpriced.length) {
  document.getElementById("unpriced").innerHTML =
    '<div class="note"><b>' + DATA.unpriced.length + " machine(s) with no per-GPU-hour figure.</b> "
    + "Their list price is recorded and archived, but the chip or the number of chips could not "
    + "be established from the provider's own data, so the normalized figure is left blank "
    + "rather than guessed. A wrong number that looks plausible is worse than a blank."
    + "<ul>" + DATA.unpriced.map(r =>
        "<li><b>" + r.sku_id + "</b> <span class='muted'>" + r.provider_label + "</span> — $"
        + r.list_price + " per " + r.list_price_unit.toLowerCase() + "</li>").join("")
    + "</ul></div>";
}

/* ---------- charts ---------- */
// Color follows the entity, never its rank: each provider owns a fixed slot
// for the life of the page, so changing the price type or dropping a provider
// never repaints the survivors.
const PROVIDER_SLOT = { oracle: 1, azure: 2, gcp: 3 };
const colorOf = provider => "var(--series-" + (PROVIDER_SLOT[provider] || 8) + ")";

const tip = document.getElementById("tip");
function showTip(html, evt) {
  tip.innerHTML = html;
  tip.style.opacity = 1;
  const pad = 14;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  const box = tip.getBoundingClientRect();
  if (x + box.width > innerWidth - 8) x = evt.clientX - box.width - pad;
  if (y + box.height > innerHeight - 8) y = evt.clientY - box.height - pad;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.opacity = 0; };

function drawChart(chip, series) {
  const W = 340, H = 190, L = 48, R = 12, T = 12, B = 26;
  const times = [...new Set(series.flatMap(s => s.points.map(p => p.ts)))].sort();
  const values = series.flatMap(s => s.points.map(p => p.value));
  const lo = Math.min(...values), hi = Math.max(...values);
  // Always include a sensible band even when every point is identical.
  const pad = (hi - lo) || Math.max(hi * 0.1, 0.01);
  const yMin = Math.max(0, lo - pad * 0.25), yMax = hi + pad * 0.25;

  const x = i => times.length === 1
    ? (L + W - R) / 2
    : L + (W - L - R) * (i / (times.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - yMin) / (yMax - yMin || 1));

  let svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="'
          + chip + ' price over time">';

  // Recessive gridlines with tabular tick labels.
  [yMax, (yMax + yMin) / 2, yMin].forEach(v => {
    svg += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>'
         + '<text class="axis" x="' + (L - 6) + '" y="' + (y(v) + 3.5) + '" text-anchor="end">$'
         + v.toFixed(v < 1 ? 3 : 2) + "</text>";
  });
  svg += '<line class="base" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(yMin) + '" y2="' + y(yMin) + '"/>';

  [0, times.length - 1].forEach((i, n) => {
    if (times.length === 1 && n === 1) return;
    svg += '<text class="axis" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="'
         + (times.length === 1 ? "middle" : (n === 0 ? "start" : "end")) + '">'
         + shortDate(times[i]) + "</text>";
  });

  series.forEach(s => {
    const c = colorOf(s.provider);
    const pts = s.points.map(p => [x(times.indexOf(p.ts)), y(p.value)]);
    if (pts.length > 1) {
      svg += '<polyline fill="none" stroke="' + c + '" stroke-width="2" stroke-linejoin="round"'
           + ' stroke-linecap="round" points="' + pts.map(p => p.join(",")).join(" ") + '"/>';
    }
    // A 2px surface ring keeps overlapping markers legible.
    pts.forEach(([px, py], i) => {
      const p = s.points[i];
      svg += '<circle cx="' + px + '" cy="' + py + '" r="4" fill="' + c
           + '" stroke="var(--surface-1)" stroke-width="2"'
           + ' data-label="' + s.label + '" data-ts="' + p.ts
           + '" data-value="' + p.value + '" data-sku="' + p.sku
           + '" data-region="' + p.region + '"/>';
    });
  });
  svg += "</svg>";

  const legend = series.map(s =>
    '<span><i style="background:' + colorOf(s.provider) + '"></i>' + s.label + "</span>").join("");

  const div = document.createElement("div");
  div.className = "chart";
  div.innerHTML = "<h3>" + chip + "</h3>"
                + '<div class="legend">' + legend + "</div>" + svg;

  // The tooltip names the SKU behind the number, so "cheapest" stays traceable.
  div.querySelectorAll("circle").forEach(node => {
    node.addEventListener("mousemove", e => showTip(
      "<b>" + chip + "</b> · " + node.dataset.label + "<br>"
      + shortDate(node.dataset.ts) + " · <b>$"
      + Number(node.dataset.value).toFixed(2) + "</b> per GPU-hour<br>"
      + '<span class="muted">' + node.dataset.sku + " · " + node.dataset.region + "</span>", e));
    node.addEventListener("mouseleave", hideTip);
  });
  return div;
}

const chartHost = document.getElementById("charts");

// Charts are driven by their own price-type control rather than the table
// filters, so the table can be explored without the charts moving underfoot.
const chartTypes = DATA.price_types.filter(t =>
  Object.values(DATA.charts).some(byType => byType[t]));
const chartSel = document.getElementById("f-charttype");
chartTypes.forEach(t => {
  const o = document.createElement("option");
  o.value = t; o.textContent = DATA.price_type_labels[t] || t;
  chartSel.appendChild(o);
});
chartSel.value = chartTypes.includes("on_demand") ? "on_demand" : chartTypes[0];

document.getElementById("chartnote").innerHTML = DATA.snapshots.length > 1
  ? ""
  : '<div class="note">Only one snapshot exists so far, so each chart shows a single '
    + "point. Run <code>collect.py</code> again on a later day and the lines start to draw "
    + "themselves — this history is the part that cannot be recovered after the fact.</div>";

function renderCharts() {
  const type = chartSel.value;
  document.getElementById("chartcaption").textContent =
    "One line per provider, showing the cheapest per-GPU-hour that provider lists for "
    + "that chip at the " + (DATA.price_type_labels[type] || type).toLowerCase()
    + " rate. Hover a point for the machine behind the number.";
  chartHost.innerHTML = "";
  Object.keys(DATA.charts).sort().forEach(chip => {
    const series = DATA.charts[chip][type];
    if (series && series.length) chartHost.appendChild(drawChart(chip, series));
  });
}
chartSel.addEventListener("change", renderCharts);
renderCharts();
</script>
</body>
</html>
